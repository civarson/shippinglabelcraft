name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/labelcraft.exe "dist/LabelCraft.exe"
          Compress-Archive -Path "dist/LabelCraft.exe" -DestinationPath labelcraft-${{ matrix.name }}.zip

      - name: Package (macOS .app)
        if: runner.os == 'macOS'
        run: |
          APP="dist/LabelCraft.app"
          mkdir -p "$APP/Contents/MacOS"
          cp target/release/labelcraft "$APP/Contents/MacOS/labelcraft"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>LabelCraft</string>
            <key>CFBundleDisplayName</key><string>LabelCraft</string>
            <key>CFBundleIdentifier</key><string>com.civarson.labelcraft</string>
            <key>CFBundleExecutable</key><string>labelcraft</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          codesign --force --deep -s - "$APP"
          cd dist && ditto -c -k --keepParent "LabelCraft.app" ../labelcraft-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: labelcraft-${{ matrix.name }}
          path: labelcraft-${{ matrix.name }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            ## Download
            - **Windows (x64):** `labelcraft-windows-x64.zip` → `LabelCraft.exe`
              SmartScreen will warn because the app isn't code-signed: click **More info → Run anyway**.
              If it says `VCRUNTIME140.dll` is missing, install the Microsoft Visual C++ Redistributable (x64).
            - **macOS (Apple Silicon):** `labelcraft-macos-arm64.zip` → `LabelCraft.app`
              Right-click → **Open** the first time (the app is ad-hoc signed).

            ## Using it
            Drop a label PDF or image on the window, check that the barcodes list is green, pick your printer, and click **Print label**.
            If the size or position is off, set the printer's default paper to 100 × 150 mm (4 × 6 in) in its driver settings.

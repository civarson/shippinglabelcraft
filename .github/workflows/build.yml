name: build

# Every push to main builds Windows, macOS (universal) and Linux apps. If Cargo.toml's version has no
# release yet, a GitHub Release "vX.Y.Z" is created with both zips attached.
# Pushing a v* tag (or publishing a release from the web UI) builds and attaches too.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-universal
          - os: ubuntu-22.04 # oldest supported glibc, so the binary runs on more distros
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release

      - name: Build (macOS, Apple Silicon + Intel)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/labelcraft \
            target/aarch64-apple-darwin/release/labelcraft \
            target/x86_64-apple-darwin/release/labelcraft
          lipo -info target/release/labelcraft

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/labelcraft.exe "dist/LabelCraft.exe"
          Compress-Archive -Path "dist/LabelCraft.exe" -DestinationPath labelcraft-${{ matrix.name }}.zip

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc /Q "/DAppVersion=$version" "/DSourceExe=$PWD\target\release\labelcraft.exe" packaging\windows\labelcraft.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item dist\labelcraft-windows-x64-setup.exe .

      - name: Package (macOS .app)
        if: runner.os == 'macOS'
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          APP="dist/LabelCraft.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/labelcraft "$APP/Contents/MacOS/labelcraft"
          ICONSET=dist/AppIcon.iconset
          mkdir -p $ICONSET
          for s in 16 32 128 256 512; do
            sips -z $s $s packaging/macos/icon-1024.png --out $ICONSET/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) packaging/macos/icon-1024.png --out $ICONSET/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns $ICONSET -o "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>LabelCraft</string>
            <key>CFBundleDisplayName</key><string>LabelCraft</string>
            <key>CFBundleIdentifier</key><string>com.civarson.labelcraft</string>
            <key>CFBundleExecutable</key><string>labelcraft</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSRequiresAquaSystemAppearance</key><false/>
          </dict></plist>
          PLIST
          codesign --force --deep -s - "$APP"
          cd dist && ditto -c -k --keepParent "LabelCraft.app" ../labelcraft-${{ matrix.name }}.zip

      - name: Package (Linux AppImage + tar.gz)
        if: runner.os == 'Linux'
        run: |
          strip target/release/labelcraft
          # Plain tarball
          mkdir -p dist/labelcraft
          cp target/release/labelcraft packaging/linux/labelcraft.desktop packaging/linux/labelcraft.png README.md dist/labelcraft/
          tar -C dist -czf labelcraft-${{ matrix.name }}.tar.gz labelcraft
          # AppImage
          APPDIR=dist/LabelCraft.AppDir
          mkdir -p $APPDIR/usr/bin
          cp target/release/labelcraft $APPDIR/usr/bin/
          cp packaging/linux/labelcraft.desktop packaging/linux/labelcraft.png $APPDIR/
          ln -s usr/bin/labelcraft $APPDIR/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool $APPDIR labelcraft-${{ matrix.name }}.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: labelcraft-${{ matrix.name }}
          path: |
            labelcraft-${{ matrix.name }}.zip
            labelcraft-${{ matrix.name }}-setup.exe
            labelcraft-${{ matrix.name }}.tar.gz
            labelcraft-${{ matrix.name }}.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decide release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            TAG="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists; bump the version in Cargo.toml to publish a new one."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.publish == 'true'
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        if: steps.tag.outputs.publish == 'true'
        run: .github/release-notes.sh "${{ steps.tag.outputs.name }}" > notes.md && cat notes.md
      - uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: LabelCraft ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body_path: notes.md

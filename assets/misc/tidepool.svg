<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400">
  <defs>
    <radialGradient id="water" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#7FD3E6"/>
      <stop offset="1" stop-color="#2B7FA8"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F28A5B"/>
      <stop offset="0.6" stop-color="#E4573A"/>
      <stop offset="1" stop-color="#C9432A"/>
    </linearGradient>
    <clipPath id="bodyclip">
      <ellipse cx="250" cy="205" rx="138" ry="104"/>
    </clipPath>
  </defs>

  <rect width="520" height="400" rx="28" fill="url(#water)"/>
  <!-- seabed -->
  <path d="M0 352 Q90 330 180 350 T360 346 T520 340 V400 H0Z" fill="#E9D8A6"/>
  <path d="M60 352 q8 -40 -4 -70 M74 352 q-10 -30 6 -58" stroke="#3E9B6E" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M452 346 q10 -46 -6 -80 M466 346 q-6 -26 8 -52" stroke="#3E9B6E" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- tail -->
  <path d="M378 205 L470 140 Q452 205 470 270 Z" fill="#C9432A" stroke="#2A2521" stroke-width="5" stroke-linejoin="round"/>
  <!-- top fin -->
  <path d="M190 112 Q250 52 318 118" fill="#C9432A" stroke="#2A2521" stroke-width="5" stroke-linejoin="round"/>

  <!-- body -->
  <ellipse cx="250" cy="205" rx="138" ry="104" fill="url(#body)" stroke="#2A2521" stroke-width="5"/>
  <!-- barcode stripes along the back half -->
  <g clip-path="url(#bodyclip)" fill="#2A2521" opacity="0.85">
    <rect x="268" y="90" width="8" height="240"/>
    <rect x="282" y="90" width="4" height="240"/>
    <rect x="292" y="90" width="12" height="240"/>
    <rect x="310" y="90" width="4" height="240"/>
    <rect x="320" y="90" width="8" height="240"/>
    <rect x="334" y="90" width="4" height="240"/>
    <rect x="344" y="90" width="10" height="240"/>
    <rect x="360" y="90" width="4" height="240"/>
  </g>
  <!-- belly -->
  <ellipse cx="232" cy="278" rx="104" ry="36" fill="#FBE3D6" opacity="0.85" clip-path="url(#bodyclip)"/>

  <!-- side fin holding a tiny shipping tag -->
  <path d="M220 228 Q206 262 238 270 Q250 246 220 228Z" fill="#C9432A" stroke="#2A2521" stroke-width="4" stroke-linejoin="round"/>
  <line x1="236" y1="266" x2="236" y2="292" stroke="#2A2521" stroke-width="3"/>
  <g transform="rotate(-8 236 314)">
    <rect x="212" y="292" width="48" height="40" rx="6" fill="#FFFFFF" stroke="#2A2521" stroke-width="3"/>
    <circle cx="236" cy="300" r="3" fill="#2A2521"/>
    <g fill="#2A2521">
      <rect x="219" y="309" width="3" height="16"/><rect x="225" y="309" width="2" height="16"/>
      <rect x="230" y="309" width="4" height="16"/><rect x="237" y="309" width="2" height="16"/>
      <rect x="242" y="309" width="3" height="16"/><rect x="248" y="309" width="2" height="16"/>
      <rect x="252" y="309" width="3" height="16"/>
    </g>
  </g>

  <!-- eye: small, round, content -->
  <circle cx="168" cy="178" r="22" fill="#FFFFFF" stroke="#2A2521" stroke-width="4"/>
  <circle cx="162" cy="180" r="10" fill="#2A2521"/>
  <circle cx="158" cy="176" r="3.5" fill="#FFFFFF"/>
  <!-- rosy cheek and a small closed smile -->
  <ellipse cx="160" cy="222" rx="14" ry="8" fill="#F7A98C" opacity="0.8"/>
  <path d="M124 214 Q136 226 150 218" stroke="#2A2521" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- bubbles -->
  <g fill="none" stroke="#E8F7FB" stroke-width="3">
    <circle cx="104" cy="170" r="7"/>
    <circle cx="86" cy="132" r="10"/>
    <circle cx="98" cy="88" r="5"/>
  </g>
</svg>
